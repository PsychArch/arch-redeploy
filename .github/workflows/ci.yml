name: checks

on:
  push:
  pull_request:

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install check dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq zstd cpio gnupg
      - name: Run non-destructive checks
        run: ./scripts/check.sh
